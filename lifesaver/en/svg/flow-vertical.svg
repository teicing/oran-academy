<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 900" role="img" aria-labelledby="fv-title fv-desc">
<title id="fv-title">How EU-LS works in 6 steps</title>
<desc id="fv-desc">Vertical operational flow: 1 Detect, 2 Locate, 3 Transmit, 4 Process, 5 Alert, 6 Respond.</desc>
<defs>
  <marker id="fv-arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M1 1 L9 5 L1 9" fill="none" stroke="#4CC3FF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
  <radialGradient id="fv-pg"><stop offset="0" stop-color="#B8F04A"/><stop offset="1" stop-color="#B8F04A" stop-opacity="0"/></radialGradient>
</defs>
<style>
  .f-t{font-family:"Space Grotesk",Inter,sans-serif;font-weight:700;fill:#E6EDF7}
  .f-s{font-family:Inter,"Space Grotesk",sans-serif;fill:#8EA0B8}
  .f-n{font-family:"JetBrains Mono",monospace;font-weight:700;fill:#0B1220}
  .f-ico{fill:none;stroke:#B8F04A;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
  .f-ring{fill:none;stroke:#B8F04A;stroke-width:2.5;opacity:0;animation:f-ring 6s linear infinite}
  @keyframes f-ring{0%{opacity:1}14%{opacity:0}100%{opacity:0}}
  @media (prefers-reduced-motion:reduce){.f-ring{animation:none}.f-pulse{display:none}}
</style>
  <line x1="64" y1="72" x2="64" y2="832" stroke="#22314A" stroke-width="2"/>
  <line x1="64" y1="120" x2="64" y2="174" stroke="#4CC3FF" stroke-width="2" stroke-dasharray="4 6" marker-end="url(#fv-arr)"/>
  <line x1="64" y1="272" x2="64" y2="326" stroke="#4CC3FF" stroke-width="2" stroke-dasharray="4 6" marker-end="url(#fv-arr)"/>
  <line x1="64" y1="424" x2="64" y2="478" stroke="#4CC3FF" stroke-width="2" stroke-dasharray="4 6" marker-end="url(#fv-arr)"/>
  <line x1="64" y1="576" x2="64" y2="630" stroke="#4CC3FF" stroke-width="2" stroke-dasharray="4 6" marker-end="url(#fv-arr)"/>
  <line x1="64" y1="728" x2="64" y2="782" stroke="#4CC3FF" stroke-width="2" stroke-dasharray="4 6" marker-end="url(#fv-arr)"/>
  <g class="f-pulse">
    <circle r="14" fill="url(#fv-pg)" opacity="0.8"><animateMotion dur="6s" repeatCount="indefinite" path="M64 72 V832"/></circle>
    <circle r="4" fill="#B8F04A"><animateMotion dur="6s" repeatCount="indefinite" path="M64 72 V832"/></circle>
  </g>
  <g>
    <circle cx="64" cy="72" r="36" fill="#111A2B" stroke="#22314A" stroke-width="2"/>
    <circle class="f-ring" cx="64" cy="72" r="42" style="animation-delay:0.0s"/>
    <g class="f-ico" transform="translate(41.2 49.2) scale(0.95)"><path d="M4 28 H13 L17 19 L23 40 L29 8 L33 28 H44"/></g>
    <circle cx="89.9" cy="46.1" r="12" fill="#4CC3FF" stroke="#0B1220" stroke-width="3"/>
    <text class="f-n" x="89.9" y="50.1" font-size="12" text-anchor="middle">1</text>
  </g>
  <text class="f-t" x="130" y="70" font-size="20">Detect</text>
  <text class="f-s" x="130" y="92" font-size="14">Fall, impact or SOS</text>
  <g>
    <circle cx="64" cy="224" r="36" fill="#111A2B" stroke="#22314A" stroke-width="2"/>
    <circle class="f-ring" cx="64" cy="224" r="42" style="animation-delay:1.2s"/>
    <g class="f-ico" transform="translate(41.2 201.2) scale(0.95)"><path d="M24 43 C24 43 11 31 11 20 A13 13 0 0 1 37 20 C37 31 24 43 24 43 Z"/><circle cx="24" cy="20" r="4.5"/></g>
    <circle cx="89.9" cy="198.1" r="12" fill="#4CC3FF" stroke="#0B1220" stroke-width="3"/>
    <text class="f-n" x="89.9" y="202.1" font-size="12" text-anchor="middle">2</text>
  </g>
  <text class="f-t" x="130" y="222" font-size="20">Locate</text>
  <text class="f-s" x="130" y="244" font-size="14">GNSS fix + context</text>
  <g>
    <circle cx="64" cy="376" r="36" fill="#111A2B" stroke="#22314A" stroke-width="2"/>
    <circle class="f-ring" cx="64" cy="376" r="42" style="animation-delay:2.4s"/>
    <g class="f-ico" transform="translate(41.2 353.2) scale(0.95)"><path d="M24 22 V43 M17 43 L24 22 L31 43 M19.5 35 H28.5"/><circle cx="24" cy="18" r="2.5"/><path d="M16 11 A11 11 0 0 0 16 25 M32 11 A11 11 0 0 1 32 25 M10 6 A18 18 0 0 0 10 30 M38 6 A18 18 0 0 1 38 30"/></g>
    <circle cx="89.9" cy="350.1" r="12" fill="#4CC3FF" stroke="#0B1220" stroke-width="3"/>
    <text class="f-n" x="89.9" y="354.1" font-size="12" text-anchor="middle">3</text>
  </g>
  <text class="f-t" x="130" y="374" font-size="20">Transmit</text>
  <text class="f-s" x="130" y="396" font-size="14">NB-IoT / NB-NTN</text>
  <g>
    <circle cx="64" cy="528" r="36" fill="#111A2B" stroke="#22314A" stroke-width="2"/>
    <circle class="f-ring" cx="64" cy="528" r="42" style="animation-delay:3.6s"/>
    <g class="f-ico" transform="translate(41.2 505.2) scale(0.95)"><path d="M14 36 H35 A8 8 0 0 0 34 20 A11 11 0 0 0 13 22 A7 7 0 0 0 14 36 Z"/><path d="M18 28 L22.5 32 L30 24"/></g>
    <circle cx="89.9" cy="502.1" r="12" fill="#4CC3FF" stroke="#0B1220" stroke-width="3"/>
    <text class="f-n" x="89.9" y="506.1" font-size="12" text-anchor="middle">4</text>
  </g>
  <text class="f-t" x="130" y="526" font-size="20">Process</text>
  <text class="f-s" x="130" y="548" font-size="14">Rules per use case</text>
  <g>
    <circle cx="64" cy="680" r="36" fill="#111A2B" stroke="#22314A" stroke-width="2"/>
    <circle class="f-ring" cx="64" cy="680" r="42" style="animation-delay:4.8s"/>
    <g class="f-ico" transform="translate(41.2 657.2) scale(0.95)"><path d="M15 33 V22 A9 9 0 0 1 33 22 V33 L36 36 H12 Z"/><path d="M21 40 A3.5 3.5 0 0 0 27 40"/><path d="M24 9 V12 M7 20 H10 M38 20 H41 M10 9 L12.5 11.5 M38 9 L35.5 11.5"/></g>
    <circle cx="89.9" cy="654.1" r="12" fill="#4CC3FF" stroke="#0B1220" stroke-width="3"/>
    <text class="f-n" x="89.9" y="658.1" font-size="12" text-anchor="middle">5</text>
  </g>
  <text class="f-t" x="130" y="678" font-size="20">Alert</text>
  <text class="f-s" x="130" y="700" font-size="14">App, contacts, control room</text>
  <g>
    <circle cx="64" cy="832" r="36" fill="#111A2B" stroke="#22314A" stroke-width="2"/>
    <circle class="f-ring" cx="64" cy="832" r="42" style="animation-delay:6.0s"/>
    <g class="f-ico" transform="translate(41.2 809.2) scale(0.95)"><path d="M24 6 L38 11.5 V22 C38 32 32 39 24 42 C16 39 10 32 10 22 V11.5 Z"/><path d="M24 17 V31 M17 24 H31"/></g>
    <circle cx="89.9" cy="806.1" r="12" fill="#4CC3FF" stroke="#0B1220" stroke-width="3"/>
    <text class="f-n" x="89.9" y="810.1" font-size="12" text-anchor="middle">6</text>
  </g>
  <text class="f-t" x="130" y="830" font-size="20">Respond</text>
  <text class="f-s" x="130" y="852" font-size="14">Live map and history</text>
</svg>
