    <circle cx="530.2" cy="43.8" r="12" fill="#4CC3FF" stroke="#0B1220" stroke-width="3"/>
    <text class="f-n" x="530.2" y="47.8" font-size="12" text-anchor="middle">3</text>
  </g>
  <text class="f-t" x="500" y="160" font-size="19" text-anchor="middle">Trasmetti</text>
  <text class="f-s" x="500" y="182" font-size="13" text-anchor="middle">NB-IoT / NB-NTN</text>
  <g>
    <circle cx="700" cy="74" r="42" fill="#111A2B" stroke="#22314A" stroke-width="2"/>
    <circle class="f-ring" cx="700" cy="74" r="48" style="animation-delay:3.6s"/>
    <g class="f-ico" transform="translate(672.4 46.4) scale(1.15)"><path d="M14 36 H35 A8 8 0 0 0 34 20 A11 11 0 0 0 13 22 A7 7 0 0 0 14 36 Z"/><path d="M18 28 L22.5 32 L30 24"/></g>
    <circle cx="730.2" cy="43.8" r="12" fill="#4CC3FF" stroke="#0B1220" stroke-width="3"/>
    <text class="f-n" x="730.2" y="47.8" font-size="12" text-anchor="middle">4</text>
  </g>
  <text class="f-t" x="700" y="160" font-size="19" text-anchor="middle">Elabora</text>
  <text class="f-s" x="700" y="182" font-size="13" text-anchor="middle">Regole per use case</text>
  <g>
    <circle cx="900" cy="74" r="42" fill="#111A2B" stroke="#22314A" stroke-width="2"/>
    <circle class="f-ring" cx="900" cy="74" r="48" style="animation-delay:4.8s"/>
    <g class="f-ico" transform="translate(872.4 46.4) scale(1.15)"><path d="M15 33 V22 A9 9 0 0 1 33 22 V33 L36 36 H12 Z"/><path d="M21 40 A3.5 3.5 0 0 0 27 40"/><path d="M24 9 V12 M7 20 H10 M38 20 H41 M10 9 L12.5 11.5 M38 9 L35.5 11.5"/></g>
    <circle cx="930.2" cy="43.8" r="12" fill="#4CC3FF" stroke="#0B1220" stroke-width="3"/>
    <text class="f-n" x="930.2" y="47.8" font-size="12" text-anchor="middle">5</text>
  </g>
  <text class="f-t" x="900" y="160" font-size="19" text-anchor="middle">Allerta</text>
  <text class="f-s" x="900" y="182" font-size="13" text-anchor="middle">App, contatti, centrale</text>
  <g>
    <circle cx="1100" cy="74" r="42" fill="#111A2B" stroke="#22314A" stroke-width="2"/>
    <circle class="f-ring" cx="1100" cy="74" r="48" style="animation-delay:6.0s"/>
    <g class="f-ico" transform="translate(1072.4 46.4) scale(1.15)"><path d="M24 6 L38 11.5 V22 C38 32 32 39 24 42 C16 39 10 32 10 22 V11.5 Z"/><path d="M24 17 V31 M17 24 H31"/></g>
    <circle cx="1130.2" cy="43.8" r="12" fill="#4CC3FF" stroke="#0B1220" stroke-width="3"/>
    <text class="f-n" x="1130.2" y="47.8" font-size="12" text-anchor="middle">6</text>
  </g>
  <text class="f-t" x="1100" y="160" font-size="19" text-anchor="middle">Intervieni</text>
  <text class="f-s" x="1100" y="182" font-size="13" text-anchor="middle">Mappa live e storico</text>
</svg>
