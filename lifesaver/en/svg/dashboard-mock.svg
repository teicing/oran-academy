<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-labelledby="db-title db-desc">
  <title id="db-title">EU-LS dashboard mockup</title>
  <desc id="db-desc">Mockup of the control room web dashboard with sample data: active devices, open alarms and last fix indicators, map with route and alarm marker, and a list of recent events such as fall detected, SOS and low battery.</desc>
  <defs>
    <clipPath id="db-clip"><rect x="0" y="0" width="800" height="500" rx="14"/></clipPath>
    <clipPath id="db-map"><rect x="80" y="134" width="424" height="350" rx="12"/></clipPath>
    <pattern id="db-grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0 H0 V28" fill="none" stroke="#16223A" stroke-width="1"/>
    </pattern>
  </defs>
  <style>
    .d-sans{font-family:"Space Grotesk",Inter,sans-serif}
    .d-ui{font-family:Inter,"Space Grotesk",sans-serif}
    .d-mono{font-family:"JetBrains Mono",monospace}
    .d-ico{fill:none;stroke:#8EA0B8;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
    .d-ring{transform-box:fill-box;transform-origin:center;animation:d-ring 2s ease-out infinite}
    .d-ring2{animation-delay:1s}
    @keyframes d-ring{0%{transform:scale(.3);opacity:.9}100%{transform:scale(1.6);opacity:0}}
    .d-live{animation:d-live 1.4s ease-in-out infinite}
    @keyframes d-live{0%,100%{opacity:1}50%{opacity:.3}}
    .d-route{stroke-dasharray:6 6;animation:d-route 3s linear infinite}
    @keyframes d-route{to{stroke-dashoffset:-48}}
    @media (prefers-reduced-motion:reduce){.d-ring,.d-live,.d-route{animation:none}}
  </style>

  <g clip-path="url(#db-clip)">
    <rect width="800" height="500" fill="#0E1626"/>

    <!-- top bar -->
    <rect width="800" height="38" fill="#111A2B"/>
    <line x1="0" y1="38" x2="800" y2="38" stroke="#22314A"/>
    <circle cx="20" cy="19" r="5" fill="#FF4D4D" opacity="0.8"/><circle cx="36" cy="19" r="5" fill="#FFC247" opacity="0.8"/><circle cx="52" cy="19" r="5" fill="#B8F04A" opacity="0.8"/>
    <text x="80" y="24" class="d-sans" font-size="13" font-weight="700" fill="#E6EDF7">EU-LS <tspan fill="#8EA0B8" font-weight="400">· Control room</tspan></text>
    <rect x="560" y="10" width="124" height="18" rx="9" fill="#0B1220" stroke="#22314A"/>
    <text x="622" y="23" class="d-mono" font-size="11" fill="#FFC247" text-anchor="middle">sample data</text>
    <circle cx="764" cy="19" r="11" fill="#22314A"/>
    <text x="764" y="23" class="d-ui" font-size="11" font-weight="700" fill="#E6EDF7" text-anchor="middle">OP</text>

    <!-- sidebar -->
    <rect x="0" y="38" width="64" height="462" fill="#0B1220"/>
    <line x1="64" y1="38" x2="64" y2="500" stroke="#22314A"/>
    <rect x="16" y="52" width="32" height="32" rx="9" fill="#B8F04A"/>
    <path d="M32 59 L41 63 V69 C41 74 37 77 32 79 C27 77 23 74 23 69 V63 Z" fill="none" stroke="#0B1220" stroke-width="2" stroke-linejoin="round"/>
    <rect x="12" y="104" width="40" height="38" rx="10" fill="#111A2B" stroke="#22314A"/>
    <rect x="9" y="112" width="3" height="22" rx="1.5" fill="#B8F04A"/>
    <g class="d-ico" style="stroke:#B8F04A"><path d="M22 116 L28 113 L36 117 L42 114 V128 L36 131 L28 127 L22 130 Z M28 113 V127 M36 117 V131"/></g>
    <g transform="translate(0 12)"><g class="d-ico"><path d="M23 166 V156 A9 9 0 0 1 41 156 V166 L43 168 H21 Z M29 172 A3 3 0 0 0 35 172"/></g>
    <g class="d-ico"><rect x="24" y="200" width="16" height="24" rx="3"/><path d="M30 220 H34"/></g>
    <g class="d-ico"><path d="M22 266 H42 M22 266 V248 M28 262 V256 M34 262 V250 M40 262 V254"/></g>
    <g class="d-ico"><circle cx="32" cy="304" r="4"/><path d="M32 292 V295 M32 313 V316 M20 304 H23 M41 304 H44 M23.5 295.5 L25.6 297.6 M38.4 310.4 L40.5 312.5 M23.5 312.5 L25.6 310.4 M38.4 297.6 L40.5 295.5"/></g></g>

    <!-- KPI -->
    <g>
      <rect x="80" y="52" width="226" height="68" rx="12" fill="#111A2B" stroke="#22314A"/>
      <text x="96" y="74" class="d-ui" font-size="11.5" fill="#8EA0B8">Active devices</text>
      <text x="96" y="104" class="d-sans" font-size="24" font-weight="700" fill="#E6EDF7">128</text>
      <circle cx="152" cy="96" r="4" fill="#B8F04A" class="d-live"/>
      <text x="160" y="100" class="d-ui" font-size="11" fill="#B8F04A">online</text>
      <polyline points="220,104 232,96 244,100 256,88 268,92 280,80 290,84" fill="none" stroke="#4CC3FF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

      <rect x="319" y="52" width="226" height="68" rx="12" fill="#111A2B" stroke="#FF4D4D" stroke-opacity="0.45"/>
      <text x="335" y="74" class="d-ui" font-size="11.5" fill="#8EA0B8">Open alarms</text>
      <text x="335" y="104" class="d-sans" font-size="24" font-weight="700" fill="#FF4D4D">2</text>
      <rect x="360" y="87" width="108" height="22" rx="11" fill="#FF4D4D" fill-opacity="0.15"/>
      <text x="414" y="102" class="d-ui" font-size="11" fill="#FF4D4D" text-anchor="middle">1 fall · 1 SOS</text>

      <rect x="558" y="52" width="226" height="68" rx="12" fill="#111A2B" stroke="#22314A"/>
      <text x="574" y="74" class="d-ui" font-size="11.5" fill="#8EA0B8">Last fix</text>
      <text x="574" y="104" class="d-sans" font-size="24" font-weight="700" fill="#E6EDF7">12 s ago</text>
      <text x="768" y="74" class="d-mono" font-size="11" fill="#4CC3FF" text-anchor="end">GNSS</text>
      <g fill="#4CC3FF"><rect x="728" y="98" width="6" height="8" rx="1"/><rect x="737" y="93" width="6" height="13" rx="1"/><rect x="746" y="88" width="6" height="18" rx="1"/><rect x="755" y="83" width="6" height="23" rx="1"/></g>
    </g>

    <!-- map -->
    <g clip-path="url(#db-map)">
      <rect x="80" y="134" width="424" height="350" fill="#0B1220"/>
      <rect x="80" y="134" width="424" height="350" fill="url(#db-grid)"/>
      <g fill="none" stroke="#1B2A44" stroke-width="1.5">
        <path d="M60 220 C140 180 220 250 300 210 S440 170 520 200"/>
        <path d="M60 250 C150 210 220 280 300 240 S440 200 520 232"/>
        <path d="M60 282 C150 245 230 310 310 272 S440 236 520 266"/>
        <ellipse cx="410" cy="390" rx="70" ry="38"/>
        <ellipse cx="410" cy="390" rx="42" ry="20"/>
      </g>
      <path d="M80 430 C160 400 200 460 300 420 S420 360 520 380" fill="none" stroke="#173A5A" stroke-width="10" stroke-linecap="round"/>
      <path d="M200 134 C210 220 170 300 230 484" fill="none" stroke="#1E2C46" stroke-width="5"/>
      <!-- route -->
      <path d="M126 452 C150 410 180 380 210 360 S250 300 290 290 S340 250 352 228" fill="none" stroke="#4CC3FF" stroke-width="3" stroke-linecap="round" opacity="0.35"/>
      <path class="d-route" d="M126 452 C150 410 180 380 210 360 S250 300 290 290 S340 250 352 228" fill="none" stroke="#4CC3FF" stroke-width="3" stroke-linecap="round"/>
      <circle cx="126" cy="452" r="6" fill="#0B1220" stroke="#B8F04A" stroke-width="3"/>
      <!-- other devices -->
      <circle cx="440" cy="300" r="5" fill="#B8F04A"/>
      <circle cx="160" cy="210" r="5" fill="#B8F04A"/>
      <circle cx="458" cy="440" r="5" fill="#FFC247"/>
      <!-- alarm -->
      <circle class="d-ring" cx="352" cy="228" r="26" fill="#FF4D4D" fill-opacity="0.35"/>
      <circle class="d-ring d-ring2" cx="352" cy="228" r="26" fill="#FF4D4D" fill-opacity="0.35"/>
      <circle cx="352" cy="228" r="9" fill="#FF4D4D" stroke="#0B1220" stroke-width="3"/>
      <!-- tooltip -->
      <g>
        <rect x="240" y="158" width="160" height="40" rx="8" fill="#111A2B" stroke="#FF4D4D" stroke-opacity="0.6"/>
        <path d="M344 198 L352 208 L360 198 Z" fill="#111A2B"/>
        <text x="252" y="175" class="d-mono" font-size="11" font-weight="700" fill="#FF4D4D">SB_00412</text>
        <text x="252" y="190" class="d-ui" font-size="11" fill="#E6EDF7">Fall detected · 2 min</text>
      </g>
      <!-- map controls -->
      <rect x="470" y="148" width="22" height="44" rx="6" fill="#111A2B" stroke="#22314A"/>
      <path d="M481 156 V166 M476 161 H486 M476 182 H486" stroke="#8EA0B8" stroke-width="1.6" stroke-linecap="round"/>
      <text x="94" y="474" class="d-mono" font-size="11" fill="#8EA0B8">LIVE MAP</text>
    </g>
    <rect x="80" y="134" width="424" height="350" rx="12" fill="none" stroke="#22314A"/>

    <!-- event list -->
    <rect x="516" y="134" width="268" height="350" rx="12" fill="#111A2B" stroke="#22314A"/>
    <text x="532" y="160" class="d-sans" font-size="14" font-weight="700" fill="#E6EDF7">Recent events</text>
    <circle cx="726" cy="155" r="4" fill="#B8F04A" class="d-live"/>
    <text x="768" y="159" class="d-mono" font-size="11" fill="#B8F04A" text-anchor="end">LIVE</text>
    <line x1="516" y1="174" x2="784" y2="174" stroke="#22314A"/>

    <g>
      <rect x="524" y="182" width="252" height="54" rx="9" fill="#FF4D4D" fill-opacity="0.08" stroke="#FF4D4D" stroke-opacity="0.35"/>
      <circle cx="542" cy="209" r="5" fill="#FF4D4D"/>
      <text x="556" y="204" class="d-mono" font-size="11.5" font-weight="700" fill="#E6EDF7">SB_00412</text>
      <text x="556" y="222" class="d-ui" font-size="12" fill="#FF4D4D">Fall detected</text>
      <text x="766" y="204" class="d-ui" font-size="11" fill="#8EA0B8" text-anchor="end">2 min ago</text>
      <text x="766" y="222" class="d-mono" font-size="11" fill="#FF4D4D" text-anchor="end">OPEN</text>
    </g>
    <g>
      <rect x="524" y="242" width="252" height="54" rx="9" fill="#FF4D4D" fill-opacity="0.05" stroke="#22314A"/>
      <circle cx="542" cy="269" r="5" fill="#FF4D4D"/>
      <text x="556" y="264" class="d-mono" font-size="11.5" font-weight="700" fill="#E6EDF7">SK_00087</text>
      <text x="556" y="282" class="d-ui" font-size="12" fill="#FF4D4D">SOS</text>
      <text x="766" y="264" class="d-ui" font-size="11" fill="#8EA0B8" text-anchor="end">7 min ago</text>
      <text x="766" y="282" class="d-mono" font-size="11" fill="#FFC247" text-anchor="end">ASSIGNED</text>
    </g>
    <g>
      <rect x="524" y="302" width="252" height="54" rx="9" fill="none" stroke="#22314A"/>
      <circle cx="542" cy="329" r="5" fill="#FFC247"/>
      <text x="556" y="324" class="d-mono" font-size="11.5" font-weight="700" fill="#E6EDF7">SB_00133</text>
      <text x="556" y="342" class="d-ui" font-size="12" fill="#FFC247">Low battery</text>
      <text x="766" y="324" class="d-ui" font-size="11" fill="#8EA0B8" text-anchor="end">18 min ago</text>
    </g>
    <g>
      <rect x="524" y="362" width="252" height="54" rx="9" fill="none" stroke="#22314A"/>
      <circle cx="542" cy="389" r="5" fill="#4CC3FF"/>
      <text x="556" y="384" class="d-mono" font-size="11.5" font-weight="700" fill="#E6EDF7">SK_00021</text>
      <text x="556" y="402" class="d-ui" font-size="12" fill="#4CC3FF">GNSS fix restored</text>
      <text x="766" y="384" class="d-ui" font-size="11" fill="#8EA0B8" text-anchor="end">25 min ago</text>
    </g>
    <g>
      <rect x="524" y="422" width="252" height="54" rx="9" fill="none" stroke="#22314A"/>
      <circle cx="542" cy="449" r="5" fill="#B8F04A"/>
      <text x="556" y="444" class="d-mono" font-size="11.5" font-weight="700" fill="#E6EDF7">SB_00290</text>
      <text x="556" y="462" class="d-ui" font-size="12" fill="#B8F04A">Session started</text>
      <text x="766" y="444" class="d-ui" font-size="11" fill="#8EA0B8" text-anchor="end">31 min ago</text>
    </g>
  </g>
  <rect x="0.5" y="0.5" width="799" height="499" rx="14" fill="none" stroke="#22314A"/>
</svg>
