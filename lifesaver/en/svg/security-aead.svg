<rect x="512" y="56" width="464" height="392" rx="14" fill="#0B1220" stroke="#22314A"/>
<rect x="512" y="56" width="464" height="4" rx="2" fill="#B8F04A"/>
<text x="582" y="110" font-family="Inter,system-ui,sans-serif" font-size="12" font-weight="500" fill="#8EA0B8" text-anchor="middle" >Device</text>
<line x1="582" y1="118" x2="582" y2="356" stroke="#22314A" stroke-width="2"/>
<text x="906" y="110" font-family="Inter,system-ui,sans-serif" font-size="12" font-weight="500" fill="#8EA0B8" text-anchor="middle" >EU-LS server</text>
<line x1="906" y1="118" x2="906" y2="356" stroke="#22314A" stroke-width="2"/>
<line x1="94" y1="134" x2="414" y2="146" stroke="#FF4D4D" stroke-width="2" marker-end="url(#a-FF4D4D)"/>
<text x="256.0" y="136" font-family="JetBrains Mono,ui-monospace,monospace" font-size="10.5" font-weight="400" fill="#8EA0B8" text-anchor="middle" >ClientHello</text>
<line x1="418" y1="158" x2="98" y2="170" stroke="#FF4D4D" stroke-width="2" marker-end="url(#a-FF4D4D)"/>
<text x="256.0" y="160" font-family="JetBrains Mono,ui-monospace,monospace" font-size="10.5" font-weight="400" fill="#8EA0B8" text-anchor="middle" >HelloVerifyRequest</text>
<line x1="94" y1="182" x2="414" y2="194" stroke="#FF4D4D" stroke-width="2" marker-end="url(#a-FF4D4D)"/>
<text x="256.0" y="184" font-family="JetBrains Mono,ui-monospace,monospace" font-size="10.5" font-weight="400" fill="#8EA0B8" text-anchor="middle" >ClientHello + cookie</text>
<line x1="418" y1="206" x2="98" y2="218" stroke="#FF4D4D" stroke-width="2" marker-end="url(#a-FF4D4D)"/>
<text x="256.0" y="208" font-family="JetBrains Mono,ui-monospace,monospace" font-size="10.5" font-weight="400" fill="#8EA0B8" text-anchor="middle" >ServerHello … Finished</text>
<line x1="94" y1="230" x2="414" y2="242" stroke="#FF4D4D" stroke-width="2" marker-end="url(#a-FF4D4D)"/>
<text x="256.0" y="232" font-family="JetBrains Mono,ui-monospace,monospace" font-size="10.5" font-weight="400" fill="#8EA0B8" text-anchor="middle" >ClientKeyExchange … Finished</text>
<line x1="418" y1="254" x2="98" y2="266" stroke="#FF4D4D" stroke-width="2" marker-end="url(#a-FF4D4D)"/>
<text x="256.0" y="256" font-family="JetBrains Mono,ui-monospace,monospace" font-size="10.5" font-weight="400" fill="#8EA0B8" text-anchor="middle" >Finished</text>
<rect x="134" y="276" width="244" height="40" rx="8" fill="#FF4D4D" fill-opacity=".10" stroke="#FF4D4D" stroke-opacity=".5"/>
<text x="256.0" y="292" font-family="Inter,system-ui,sans-serif" font-size="11.5" font-weight="600" fill="#E6EDF7" text-anchor="middle" >handshake: 4 round trips via GEO</text>
<text x="256.0" y="308" font-family="JetBrains Mono,ui-monospace,monospace" font-size="11.5" font-weight="600" fill="#FF4D4D" text-anchor="middle" >35–140 s · modem blocked</text>
<line x1="94" y1="332" x2="414" y2="342" stroke="#8EA0B8" stroke-width="2" marker-end="url(#a-8EA0B8)"/>
<text x="256.0" y="332" font-family="JetBrains Mono,ui-monospace,monospace" font-size="10.5" font-weight="400" fill="#8EA0B8" text-anchor="middle" >data (at last)</text>
<text x="256" y="368" font-family="Inter,system-ui,sans-serif" font-size="11.5" font-weight="600" fill="#FFC247" text-anchor="middle" >NAT changes port after 70–180 s →</text>
<text x="256" y="384" font-family="Inter,system-ui,sans-serif" font-size="11.5" font-weight="600" fill="#FFC247" text-anchor="middle" >new handshake for every send</text>
<text x="256" y="420" font-family="Space Grotesk,Inter,sans-serif" font-size="15" font-weight="700" fill="#FF4D4D" text-anchor="middle" >~3.4 KB per satellite send</text>
<text x="256" y="437" font-family="Inter,system-ui,sans-serif" font-size="11" font-weight="400" fill="#8EA0B8" text-anchor="middle" >over half = session management</text>
<line x1="582" y1="150" x2="902" y2="178" stroke="#B8F04A" stroke-width="2" marker-end="url(#a-B8F04A)"/>
<text x="744.0" y="152" font-family="JetBrains Mono,ui-monospace,monospace" font-size="11" font-weight="600" fill="#E6EDF7" text-anchor="middle" >CoAP CON · CBOR encrypted + signed</text>
<line x1="906" y1="214" x2="586" y2="242" stroke="#4CC3FF" stroke-width="2" marker-end="url(#a-4CC3FF)"/>
<text x="744.0" y="216" font-family="JetBrains Mono,ui-monospace,monospace" font-size="11" font-weight="600" fill="#E6EDF7" text-anchor="middle" >2.04 · encrypted + signed reply</text>
<rect x="592" y="270" width="304" height="34" rx="8" fill="#B8F04A" fill-opacity=".08" stroke="#B8F04A" stroke-opacity=".5"/>
<text x="744.0" y="292" font-family="Inter,system-ui,sans-serif" font-size="11.5" font-weight="600" fill="#E6EDF7" text-anchor="middle" >1 packet up, 1 down · no session · NAT irrelevant</text>
<text x="744" y="420" font-family="Space Grotesk,Inter,sans-serif" font-size="15" font-weight="700" fill="#B8F04A" text-anchor="middle" >~0.26 KB per send · ~10 s</text>
<text x="744" y="437" font-family="Inter,system-ui,sans-serif" font-size="11" font-weight="400" fill="#8EA0B8" text-anchor="middle" >the SOS travels in the first packet</text>
<text x="28" y="490" font-family="JetBrains Mono,ui-monospace,monospace" font-size="12" font-weight="600" fill="#8EA0B8" text-anchor="start" letter-spacing="1.2">AEAD ENVELOPE · 25 B FIXED PER MESSAGE</text>
<rect x="28" y="502" width="76" height="54" rx="8" fill="#8EA0B8" fill-opacity=".14" stroke="#8EA0B8" stroke-opacity=".7"/>
<text x="66.0" y="526" font-family="JetBrains Mono,ui-monospace,monospace" font-size="12" font-weight="700" fill="#E6EDF7" text-anchor="middle" >VER</text>
<text x="66.0" y="545" font-family="JetBrains Mono,ui-monospace,monospace" font-size="11" font-weight="600" fill="#8EA0B8" text-anchor="middle" >1 B</text>
<text x="66.0" y="576" font-family="Inter,system-ui,sans-serif" font-size="11" font-weight="400" fill="#8EA0B8" text-anchor="middle" >version</text>
<rect x="108" y="502" width="146" height="54" rx="8" fill="#4CC3FF" fill-opacity=".14" stroke="#4CC3FF" stroke-opacity=".7"/>
<text x="181.0" y="526" font-family="JetBrains Mono,ui-monospace,monospace" font-size="13" font-weight="700" fill="#E6EDF7" text-anchor="middle" >KID</text>
<text x="181.0" y="545" font-family="JetBrains Mono,ui-monospace,monospace" font-size="11" font-weight="600" fill="#4CC3FF" text-anchor="middle" >4 B</text>
<text x="181.0" y="576" font-family="Inter,system-ui,sans-serif" font-size="11" font-weight="400" fill="#8EA0B8" text-anchor="middle" >device key</text>
<rect x="258" y="502" width="166" height="54" rx="8" fill="#FFC247" fill-opacity=".14" stroke="#FFC247" stroke-opacity=".7"/>
<text x="341.0" y="526" font-family="JetBrains Mono,ui-monospace,monospace" font-size="13" font-weight="700" fill="#E6EDF7" text-anchor="middle" >CTR</text>
<text x="341.0" y="545" font-family="JetBrains Mono,ui-monospace,monospace" font-size="11" font-weight="600" fill="#FFC247" text-anchor="middle" >4 B</text>
<text x="341.0" y="576" font-family="Inter,system-ui,sans-serif" font-size="11" font-weight="400" fill="#8EA0B8" text-anchor="middle" >counter: never repeated</text>
<rect x="428" y="502" width="396" height="54" rx="8" fill="#B57BFF" fill-opacity=".14" stroke="#B57BFF" stroke-opacity=".7"/>
<text x="626.0" y="526" font-family="JetBrains Mono,ui-monospace,monospace" font-size="13" font-weight="700" fill="#E6EDF7" text-anchor="middle" >Encrypted CBOR (AES-128-GCM)</text>
<text x="626.0" y="545" font-family="JetBrains Mono,ui-monospace,monospace" font-size="11" font-weight="600" fill="#B57BFF" text-anchor="middle" >N B</text>
<text x="626.0" y="576" font-family="Inter,system-ui,sans-serif" font-size="11" font-weight="400" fill="#8EA0B8" text-anchor="middle" >unreadable without the key</text>
<rect x="828" y="502" width="140" height="54" rx="8" fill="#B8F04A" fill-opacity=".14" stroke="#B8F04A" stroke-opacity=".7"/>
<text x="898.0" y="526" font-family="JetBrains Mono,ui-monospace,monospace" font-size="13" font-weight="700" fill="#E6EDF7" text-anchor="middle" >TAG</text>
<text x="898.0" y="545" font-family="JetBrains Mono,ui-monospace,monospace" font-size="11" font-weight="600" fill="#B8F04A" text-anchor="middle" >16 B</text>
<text x="898.0" y="576" font-family="Inter,system-ui,sans-serif" font-size="11" font-weight="400" fill="#8EA0B8" text-anchor="middle" >signature: forged = dropped</text>
<path d="M30 594 v8 h394 v-8" fill="none" stroke="#22314A" stroke-width="1.5"/>
<text x="227" y="620" font-family="JetBrains Mono,ui-monospace,monospace" font-size="11" font-weight="400" fill="#8EA0B8" text-anchor="middle" >authenticated, not encrypted</text>
