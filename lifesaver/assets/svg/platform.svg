<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="pl-title pl-desc">
<title id="pl-title">Struttura della piattaforma Life Saver</title>
<desc id="pl-desc">Da sinistra: accesso (Device Life Saver NB-IoT + NB-NTN e smartphone LTE/NR; radio eNodeB banda B20 terrestre e satellite GEO a circa 37.000 km in banda S), Rete MNO + SMO (CN-NSA), sia per il ramo terrestre sia per quello satellitare, collegamento UDP 5684 con CoAP / DTLS / UDP e payload CBOR verso l'edge Eclipse Californium + Scandium (Anti-DDoS, Rate Limit, Load Balancer su due istanze N+1, CoAP DTLS Gateway), poi HTTP REST / MQTT verso il core ThingsBoard CE + PostgreSQL (Data Collection, Data Storage, Data Exposure), Northbound Interface e REST APIs verso i partner multitenant. Lo smartphone raggiunge il core direttamente via App / API HTTPS o MQTT su LTE/NR, senza passare dal CoAP gateway.</desc>
<defs>
  <marker id="pl-arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#B8F04A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
  <marker id="pl-arr-b" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#4CC3FF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
  <marker id="pl-arr-v" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#B57BFF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
  <marker id="pl-arr-s" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#8EA0B8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>
<style>
  .pl-k{font-family:"JetBrains Mono",monospace;font-size:11px;letter-spacing:1.5px;fill:#8EA0B8}
  .pl-h{font-family:"Space Grotesk",Inter,sans-serif;font-weight:700;font-size:16px;fill:#E6EDF7}
  .pl-t{font-family:Inter,"Space Grotesk",sans-serif;font-size:13px;fill:#E6EDF7}
  .pl-s{font-family:Inter,"Space Grotesk",sans-serif;font-size:11.5px;fill:#8EA0B8}
