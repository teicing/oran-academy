<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 210" role="img" aria-labelledby="fh-title fh-desc">
<title id="fh-title">Come funziona Life Saver in 6 passi</title>
<desc id="fh-desc">Flusso operativo: 1 Rileva, 2 Localizza, 3 Trasmetti, 4 Elabora, 5 Allerta, 6 Intervieni.</desc>
<defs>
  <marker id="fh-arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M1 1 L9 5 L1 9" fill="none" stroke="#4CC3FF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
  <radialGradient id="fh-pg"><stop offset="0" stop-color="#B8F04A"/><stop offset="1" stop-color="#B8F04A" stop-opacity="0"/></radialGradient>
</defs>
<style>
  .f-t{font-family:"Space Grotesk",Inter,sans-serif;font-weight:700;fill:#E6EDF7}
  .f-s{font-family:Inter,"Space Grotesk",sans-serif;fill:#8EA0B8}
  .f-n{font-family:"JetBrains Mono",monospace;font-weight:700;fill:#0B1220}
  .f-ico{fill:none;stroke:#B8F04A;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
  .f-ring{fill:none;stroke:#B8F04A;stroke-width:2.5;opacity:0;animation:f-ring 6s linear infinite}
  @keyframes f-ring{0%{opacity:1}14%{opacity:0}100%{opacity:0}}
  @media (prefers-reduced-motion:reduce){.f-ring{animation:none}.f-pulse{display:none}}
</style>
  <line x1="100" y1="74" x2="1100" y2="74" stroke="#22314A" stroke-width="2"/>
  <line x1="154" y1="74" x2="244" y2="74" stroke="#4CC3FF" stroke-width="2" stroke-dasharray="4 6" marker-end="url(#fh-arr)"/>
  <line x1="354" y1="74" x2="444" y2="74" stroke="#4CC3FF" stroke-width="2" stroke-dasharray="4 6" marker-end="url(#fh-arr)"/>
  <line x1="554" y1="74" x2="644" y2="74" stroke="#4CC3FF" stroke-width="2" stroke-dasharray="4 6" marker-end="url(#fh-arr)"/>
  <line x1="754" y1="74" x2="844" y2="74" stroke="#4CC3FF" stroke-width="2" stroke-dasharray="4 6" marker-end="url(#fh-arr)"/>
  <line x1="954" y1="74" x2="1044" y2="74" stroke="#4CC3FF" stroke-width="2" stroke-dasharray="4 6" marker-end="url(#fh-arr)"/>
  <g class="f-pulse">
    <circle r="14" fill="url(#fh-pg)" opacity="0.8"><animateMotion dur="6s" repeatCount="indefinite" path="M100 74 H1100"/></circle>
    <circle r="4" fill="#B8F04A"><animateMotion dur="6s" repeatCount="indefinite" path="M100 74 H1100"/></circle>
  </g>
  <g>
    <circle cx="100" cy="74" r="42" fill="#111A2B" stroke="#22314A" stroke-width="2"/>
    <circle class="f-ring" cx="100" cy="74" r="48" style="animation-delay:0.0s"/>
    <g class="f-ico" transform="translate(72.4 46.4) scale(1.15)"><path d="M4 28 H13 L17 19 L23 40 L29 8 L33 28 H44"/></g>
    <circle cx="130.2" cy="43.8" r="12" fill="#4CC3FF" stroke="#0B1220" stroke-width="3"/>
    <text class="f-n" x="130.2" y="47.8" font-size="12" text-anchor="middle">1</text>
  </g>
  <text class="f-t" x="100" y="160" font-size="19" text-anchor="middle">Rileva</text>
  <text class="f-s" x="100" y="182" font-size="13" text-anchor="middle">Caduta, urto o SOS</text>
  <g>
    <circle cx="300" cy="74" r="42" fill="#111A2B" stroke="#22314A" stroke-width="2"/>
    <circle class="f-ring" cx="300" cy="74" r="48" style="animation-delay:1.2s"/>
    <g class="f-ico" transform="translate(272.4 46.4) scale(1.15)"><path d="M24 43 C24 43 11 31 11 20 A13 13 0 0 1 37 20 C37 31 24 43 24 43 Z"/><circle cx="24" cy="20" r="4.5"/></g>
    <circle cx="330.2" cy="43.8" r="12" fill="#4CC3FF" stroke="#0B1220" stroke-width="3"/>
    <text class="f-n" x="330.2" y="47.8" font-size="12" text-anchor="middle">2</text>
  </g>
  <text class="f-t" x="300" y="160" font-size="19" text-anchor="middle">Localizza</text>
  <text class="f-s" x="300" y="182" font-size="13" text-anchor="middle">Fix GNSS + contesto</text>
