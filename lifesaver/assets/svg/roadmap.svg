<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-labelledby="rm-title rm-desc">
<title id="rm-title">Roadmap EU-LS</title>
<desc id="rm-desc">Tre fasi. Breve termine: Device NB-IoT + NB-NTN e smartphone LTE/NR; distribuzione del valore (visione) Device 70%, Piattaforma 30%. Medio termine: Device NB-IoT + NB-NTN, smartphone LTE/NR e primi smartphone NTN (LTE/NR + NTN); fase di transizione. Lungo termine: smartphone LTE/NR + NTN + 6G che sostituisce il device; Piattaforma 100%. Tutti i terminali puntano alla stessa Piattaforma IoT multitenant con Dashboard, che resta in tutte le fasi: il valore si sposta sulla piattaforma.</desc>
<defs>
  <marker id="rm-arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#B8F04A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
  <linearGradient id="rm-grad" x1="0" x2="1" y1="0" y2="0"><stop offset="0" stop-color="#FFC247"/><stop offset="1" stop-color="#B8F04A"/></linearGradient>
  <linearGradient id="rm-grad2" gradientUnits="userSpaceOnUse" x1="60" x2="440" y1="0" y2="0"><stop offset="0" stop-color="#FFC247" stop-opacity=".7"/><stop offset="1" stop-color="#B8F04A"/></linearGradient>
</defs>
<style>
  .rm-k{font-family:"JetBrains Mono",monospace;font-size:11px;letter-spacing:1.5px;fill:#8EA0B8}
  .rm-h{font-family:"Space Grotesk",Inter,sans-serif;font-weight:700;font-size:17px;fill:#0B1220}
  .rm-t{font-family:Inter,"Space Grotesk",sans-serif;font-size:13px;fill:#E6EDF7}
  .rm-s{font-family:Inter,"Space Grotesk",sans-serif;font-size:11.5px;fill:#8EA0B8}
  .rm-m{font-family:"JetBrains Mono",monospace;font-size:11px;fill:#E6EDF7}
  .rm-b{font-family:"JetBrains Mono",monospace;font-size:11px;font-weight:700;fill:#0B1220}
  .rm-panel{fill:#111A2B;stroke:#22314A;stroke-width:1.5}
  .rm-flow{fill:none;animation:rm-dash 1.4s linear infinite}
  @keyframes rm-dash{to{stroke-dashoffset:-18}}
  .rm-pk{animation:rm-move 4s ease-in-out infinite}
  @keyframes rm-move{0%{transform:translateX(0);opacity:0}10%{opacity:1}90%{opacity:1}100%{transform:translateX(1040px);opacity:0}}
  @media (prefers-reduced-motion:reduce){.rm-flow,.rm-pk{animation:none}.rm-pk{display:none}}
</style>
<rect x="8" y="8" width="1184" height="504" rx="22" fill="none" stroke="#22314A" stroke-width="1.5"/>
<text x="36" y="44" class="rm-k">ROADMAP · DAL DEVICE ALLO SMARTPHONE, LA PIATTAFORMA RESTA</text>
