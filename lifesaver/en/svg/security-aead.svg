<rect width="1000" height="712" rx="18" fill="#111A2B"/>
<text x="500.0" y="40" font-family="Space Grotesk,Inter,sans-serif" font-size="18" font-weight="700" fill="#E6EDF7" text-anchor="middle" letter-spacing="2">SECURITY OVER SATELLITE</text>
<text x="256" y="76" font-family="Space Grotesk,Inter,sans-serif" font-size="16" font-weight="700" fill="#FF4D4D" text-anchor="middle" letter-spacing="1">SECURITY BEFORE</text>
<text x="256" y="94" font-family="JetBrains Mono,ui-monospace,monospace" font-size="11.5" font-weight="500" fill="#8EA0B8" text-anchor="middle" >DTLS · session</text>
<text x="744" y="76" font-family="Space Grotesk,Inter,sans-serif" font-size="16" font-weight="700" fill="#B8F04A" text-anchor="middle" letter-spacing="1">SECURITY AFTER</text>
<text x="744" y="94" font-family="JetBrains Mono,ui-monospace,monospace" font-size="11.5" font-weight="500" fill="#8EA0B8" text-anchor="middle" >AEAD envelope · in every message</text>
