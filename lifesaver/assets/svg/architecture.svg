<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 540" role="img" aria-labelledby="ar-title ar-desc">
<title id="ar-title">Architettura end-to-end Life Saver</title>
<desc id="ar-desc">Quattro livelli: Device (IMU, GNSS Quectel L86, modulo SIMCom SIM7080G, pulsante SOS) invia eventi tramite Rete cellulare NB-IoT / LTE-M (APN e operatore) alla Piattaforma IoT (ingestion, motore regole per use case, gestione incidenti, storage time-series, API) che alimenta i Canali: dashboard della centrale operativa, App smartphone e notifiche SMS, push ed email ai contatti di emergenza. Un flusso di ritorno porta configurazione e comandi al dispositivo.</desc>
<defs>
  <marker id="ar-arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#B8F04A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
  <marker id="ar-arr2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#FFC247" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>
<style>
  .a-k{font-family:"JetBrains Mono",monospace;font-size:11px;letter-spacing:1.5px;fill:#8EA0B8}
  .a-h{font-family:"Space Grotesk",Inter,sans-serif;font-weight:700;font-size:18px;fill:#E6EDF7}
  .a-t{font-family:Inter,"Space Grotesk",sans-serif;font-size:13px;fill:#E6EDF7}
  .a-s{font-family:Inter,"Space Grotesk",sans-serif;font-size:11.5px;fill:#8EA0B8}
  .a-m{font-family:"JetBrains Mono",monospace;font-size:13px;font-weight:700;fill:#B8F04A}
  .a-ret{animation:a-dash 1.6s linear infinite}
  @keyframes a-dash{to{stroke-dashoffset:-20}}
  .a-wave{fill:none;stroke:#4CC3FF;stroke-width:2;stroke-linecap:round;animation:a-w 2.4s ease-in-out infinite}
  .a-wave2{animation-delay:.4s}
  @keyframes a-w{0%,100%{opacity:.25}50%{opacity:1}}
  @media (prefers-reduced-motion:reduce){.a-ret,.a-wave{animation:none}.a-pk{display:none}}
</style>
