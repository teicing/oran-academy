<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 540" role="img" aria-labelledby="ca-title ca-desc">
<title id="ca-title">Affidabilità su UDP con CoAP</title>
<desc id="ca-desc">Diagramma di sequenza tra Device, CoAP DTLS Gateway sull'edge e Piattaforma ThingsBoard. Scenario A: il device invia un messaggio Confirmable CON POST /telemetry con Message-ID 0x7A21 e payload CBOR di 52 byte; il gateway inoltra via HTTP o MQTT alla piattaforma, riceve OK e risponde al device con ACK 2.04 Changed piggybacked con lo stesso Message-ID. Scenario B: il messaggio CON si perde, scade ACK_TIMEOUT, il device ritrasmette con backoff esponenziale e riceve l'ACK. Il Message-ID permette la deduplica, quindi nessun evento doppio; su satellite GEO il tempo di andata e ritorno è circa 0,5 secondi e i timer sono adattati.</desc>
<defs>
  <marker id="ca-arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#B8F04A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
  <marker id="ca-arr-b" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#4CC3FF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
  <marker id="ca-arr-a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#FFC247" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>
<style>
  .ca-k{font-family:"JetBrains Mono",monospace;font-size:11px;letter-spacing:1.5px;fill:#8EA0B8}
  .ca-h{font-family:"Space Grotesk",Inter,sans-serif;font-weight:700;font-size:15px;fill:#E6EDF7}
  .ca-t{font-family:Inter,"Space Grotesk",sans-serif;font-size:13px;fill:#E6EDF7}
  .ca-s{font-family:Inter,"Space Grotesk",sans-serif;font-size:11.5px;fill:#8EA0B8}
  .ca-m{font-family:"JetBrains Mono",monospace;font-size:12px;fill:#E6EDF7}
  .ca-life{stroke:#22314A;stroke-width:1.5;stroke-dasharray:4 5}
  .ca-step{animation:ca-seq 10s ease-in-out infinite both}
  .ca-d1{animation-delay:0s}.ca-d2{animation-delay:.5s}.ca-d3{animation-delay:1s}.ca-d4{animation-delay:1.5s}
  .ca-d5{animation-delay:2.5s}.ca-d6{animation-delay:3s}.ca-d7{animation-delay:3.5s}.ca-d8{animation-delay:4s}.ca-d9{animation-delay:4.5s}.ca-d10{animation-delay:5s}
  @keyframes ca-seq{0%{opacity:.15}6%,88%{opacity:1}100%{opacity:.15}}
  @media (prefers-reduced-motion:reduce){.ca-step{animation:none;opacity:1}}
</style>
<rect x="8" y="8" width="984" height="524" rx="22" fill="none" stroke="#22314A" stroke-width="1.5"/>
<text x="36" y="44" class="ca-k">AFFIDABILITÀ SU UDP · CoAP CONFIRMABLE + ACK</text>

<!-- lifeline heads -->
<rect x="60" y="62" width="160" height="44" rx="12" fill="#111A2B" stroke="#B8F04A" stroke-opacity=".6" stroke-width="1.5"/>
<text x="140" y="81" class="ca-h" text-anchor="middle">Device</text>
<text x="140" y="98" class="ca-s" text-anchor="middle">EU-LS</text>
<rect x="400" y="62" width="200" height="44" rx="12" fill="#111A2B" stroke="#4CC3FF" stroke-opacity=".6" stroke-width="1.5"/>
<text x="500" y="81" class="ca-h" text-anchor="middle">CoAP DTLS Gateway</text>
<text x="500" y="98" class="ca-s" text-anchor="middle">Edge · Californium</text>
<rect x="770" y="62" width="180" height="44" rx="12" fill="#111A2B" stroke="#B8F04A" stroke-opacity=".6" stroke-width="1.5"/>
<text x="860" y="81" class="ca-h" text-anchor="middle">Piattaforma</text>
<text x="860" y="98" class="ca-s" text-anchor="middle">ThingsBoard</text>
<line x1="140" y1="106" x2="140" y2="470" class="ca-life"/>
<line x1="500" y1="106" x2="500" y2="470" class="ca-life"/>
<line x1="860" y1="106" x2="860" y2="470" class="ca-life"/>

<!-- Scenario A -->
<rect x="24" y="118" width="118" height="20" rx="10" fill="#0B1220" stroke="#22314A"/>
<text x="83" y="132" class="ca-k" text-anchor="middle" style="fill:#B8F04A;letter-spacing:1px">A · CONSEGNA</text>
<g class="ca-step ca-d1">
  <text x="320" y="152" class="ca-m" text-anchor="middle">CON POST /telemetry · MID 0x7A21 · CBOR 52 B</text>
  <line x1="142" y1="160" x2="496" y2="160" stroke="#B8F04A" stroke-width="2" marker-end="url(#ca-arr)"/>
</g>
<g class="ca-step ca-d2">
  <text x="680" y="180" class="ca-m" text-anchor="middle" style="fill:#8EA0B8">HTTP / MQTT</text>
  <line x1="502" y1="188" x2="856" y2="188" stroke="#4CC3FF" stroke-width="2" marker-end="url(#ca-arr-b)"/>
</g>
<g class="ca-step ca-d3">
  <text x="680" y="208" class="ca-m" text-anchor="middle" style="fill:#8EA0B8">OK</text>
  <line x1="858" y1="216" x2="504" y2="216" stroke="#4CC3FF" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#ca-arr-b)"/>
</g>
<g class="ca-step ca-d4">
  <text x="320" y="236" class="ca-m" text-anchor="middle" style="fill:#B8F04A;font-weight:700">ACK 2.04 Changed · MID 0x7A21</text>
  <line x1="498" y1="244" x2="144" y2="244" stroke="#B8F04A" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#ca-arr)"/>
  <text x="320" y="261" class="ca-s" text-anchor="middle">piggybacked: esito applicativo nello stesso ACK</text>
</g>

<line x1="24" y1="282" x2="976" y2="282" stroke="#22314A" stroke-dasharray="2 4"/>

<!-- Scenario B -->
<rect x="24" y="294" width="186" height="20" rx="10" fill="#0B1220" stroke="#22314A"/>
<text x="117" y="308" class="ca-k" text-anchor="middle" style="fill:#FFC247;letter-spacing:1px">B · PERDITA + RETRY</text>
<g class="ca-step ca-d5">
  <text x="240" y="330" class="ca-m" text-anchor="middle">CON · MID 0x7A22</text>
  <line x1="142" y1="338" x2="318" y2="338" stroke="#B8F04A" stroke-width="2"/>
  <path d="M322 330 L338 346 M338 330 L322 346" stroke="#FF4D4D" stroke-width="3" stroke-linecap="round"/>
  <text x="350" y="342" class="ca-s" style="fill:#FF4D4D">messaggio perso</text>
</g>
<g class="ca-step ca-d6">
  <path d="M132 340 H124 V392 H132" fill="none" stroke="#FFC247" stroke-width="1.8"/>
  <text x="118" y="370" class="ca-m" text-anchor="end" style="fill:#FFC247;font-size:11px">ACK_TIMEOUT</text>
</g>
<g class="ca-step ca-d7">
  <text x="320" y="392" class="ca-m" text-anchor="middle" style="fill:#FFC247">CON · MID 0x7A22 · ritrasmissione</text>
  <line x1="142" y1="400" x2="496" y2="400" stroke="#FFC247" stroke-width="2" marker-end="url(#ca-arr-a)"/>
  <text x="320" y="416" class="ca-s" text-anchor="middle">backoff esponenziale tra un tentativo e l'altro</text>
</g>
<g class="ca-step ca-d8">
  <line x1="502" y1="412" x2="856" y2="412" stroke="#4CC3FF" stroke-width="2" marker-end="url(#ca-arr-b)"/>
  <text x="680" y="404" class="ca-m" text-anchor="middle" style="fill:#8EA0B8">HTTP / MQTT</text>
</g>
<g class="ca-step ca-d9">
  <line x1="858" y1="434" x2="504" y2="434" stroke="#4CC3FF" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#ca-arr-b)"/>
  <text x="680" y="428" class="ca-m" text-anchor="middle" style="fill:#8EA0B8">OK</text>
</g>
<g class="ca-step ca-d10">
  <text x="320" y="446" class="ca-m" text-anchor="middle" style="fill:#B8F04A;font-weight:700">ACK 2.04 Changed · MID 0x7A22</text>
  <line x1="498" y1="456" x2="144" y2="456" stroke="#B8F04A" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#ca-arr)"/>
</g>

<!-- notes -->
<rect x="36" y="484" width="440" height="32" rx="16" fill="#111A2B" stroke="#B8F04A" stroke-opacity=".5"/>
<text x="256" y="505" class="ca-t" text-anchor="middle"><tspan style="fill:#B8F04A;font-weight:600">Message-ID → deduplica:</tspan> nessun evento doppio</text>
<rect x="500" y="484" width="464" height="32" rx="16" fill="#111A2B" stroke="#B57BFF" stroke-opacity=".6"/>
<text x="732" y="505" class="ca-t" text-anchor="middle"><tspan style="fill:#B57BFF;font-weight:600">Su GEO RTT ≈ 0,5 s:</tspan> timer di ritrasmissione adattati</text>
</svg>
