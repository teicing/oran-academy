  .pl-v{font-family:"Space Grotesk",Inter,sans-serif;font-size:12px;font-weight:600;fill:#E6EDF7}
  .pl-panel{fill:#111A2B;stroke:#22314A;stroke-width:1.5}
  .pl-in{fill:#0B1220;stroke:#22314A}
  .pl-flow{animation:pl-dash 1.4s linear infinite}
  @keyframes pl-dash{to{stroke-dashoffset:-20}}
  .pl-wave{fill:none;stroke:#4CC3FF;stroke-width:1.8;stroke-linecap:round;animation:pl-w 2.4s ease-in-out infinite}
  .pl-wave2{animation-delay:.4s}
  @keyframes pl-w{0%,100%{opacity:.25}50%{opacity:1}}
  @media (prefers-reduced-motion:reduce){.pl-flow,.pl-wave{animation:none}.pl-pk{display:none}}
</style>
